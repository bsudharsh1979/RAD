services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy
      POSTGRES_DB: academy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://academy:academy@db:5432/academy
      COURSE_MATERIALS_DIR: /course-materials
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./course-materials:/course-materials:ro
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
